/**:
  turtlebot3_node:
    ros__parameters:

      namespace: ""
      enable_stamped_cmd_vel: false

      opencr:
        id: 200
        baud_rate: 1000000
        protocol_version: 2.0

      wheels:
        separation: 0.287
        radius: 0.033
        # 4바퀴 시스템을 위한 추가 설정
        front_separation: 0.287  # 전륜 간격
        rear_separation: 0.287   # 후륜 간격
        wheelbase: 0.287         # 축간 거리

      motors:
        profile_acceleration_constant: 214.577
        profile_acceleration: 0.0
        
        # 4바퀴 모터 ID 설정
        front_left_id: 1
        front_right_id: 2
        rear_left_id: 3
        rear_right_id: 4
        
        # 4바퀴 모터 주소 설정
        front_left_position_addr: 136
        front_right_position_addr: 140
        rear_left_position_addr: 141
        rear_right_position_addr: 142
        
        front_left_velocity_addr: 128
        front_right_velocity_addr: 132
        rear_left_velocity_addr: 133
        rear_right_velocity_addr: 134
        
        front_left_current_addr: 120
        front_right_current_addr: 124
        rear_left_current_addr: 125
        rear_right_current_addr: 126
        
        front_left_accel_addr: 174
        front_right_accel_addr: 178
        rear_left_accel_addr: 179
        rear_right_accel_addr: 180

      sensors:
        bumper_1: 0
        bumper_2: 0
        illumination: 0
        ir: 0
        # 초음파 센서 설정 (3개)
        ultrasonic_left: 0
        ultrasonic_front: 0
        ultrasonic_right: 0

      # 오도메트리 파라미터 추가
      odometry:
        frame_id: "odom"
        child_frame_id: "base_footprint"
        publish_tf: true
        use_imu: true
        use_4_wheel_odometry: true
        front_wheels_weight: 0.5
        rear_wheels_weight: 0.5

/**:
  turtlebot3_node:
    ros__parameters:
      # 오도메트리 파라미터 추가
      odometry:
        frame_id: "odom"
        child_frame_id: "base_footprint"
        publish_tf: true
        use_imu: true
        use_4_wheel_odometry: true
        front_wheels_weight: 0.5
        rear_wheels_weight: 0.5

/**:
  diff_drive_controller:
    ros__parameters:

      odometry:
        publish_tf: true
        use_imu: true
        frame_id: "odom"
        child_frame_id: "base_footprint"
        
        # 4바퀴 오도메트리 설정
        use_4_wheel_odometry: true
        front_wheels_weight: 0.5
        rear_wheels_weight: 0.5
