map_mode_manager:
  ros__parameters:
    # 맵 유사도 임계값 (0.0 ~ 1.0)
    similarity_threshold: 0.8
    
    # SLAM 모드 설정 파일
    slam_config_file: "turtlebot3_lds_2d.lua"
    
    # Localization 모드 설정 파일
    localization_config_file: "turtlebot3_lds_2d_localization.lua"
    
    # 맵 유사도 체크 주기 (초)
    check_interval: 5.0
    
    # 모드 전환 후 대기 시간 (초)
    mode_switch_delay: 2.0
    
    # 맵 비교 설정
    map_comparison:
      # 스캔 데이터 샘플링 비율
      scan_sampling_ratio: 0.1
      
      # 맵 해상도 (미터)
      map_resolution: 0.05
      
      # 비교 영역 크기 (미터)
      comparison_area_size: 5.0
    
    # 로깅 설정
    logging:
      enable_debug: true
      log_similarity_scores: true
      log_mode_switches: true
